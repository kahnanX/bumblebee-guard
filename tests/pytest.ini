# Keep the pytest rootdir INSIDE tests/: the repo root is itself a plugin
# package (__init__.py with relative imports), and pytest 9's Package-node
# setup tries to import it standalone, which cannot work outside a package
# context. With this file, rootdir = tests/ and the root __init__.py is
# never collected or imported by pytest itself (the test module loads it
# explicitly via importlib).
[pytest]
addopts = -q
